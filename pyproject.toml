[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simplecode"
version = "0.1.0"
description = "Multi-agent pipeline orchestrator for AI coding agents"
readme = "README.md"
license = {text = "LicenseRef-Proprietary"}
requires-python = ">=3.13"
authors = [
    {name = "CraftsmanLabs", email = "rishub@craftsmanlabs.net"},
]
keywords = ["agent", "pipeline", "orchestrator", "cli", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]

dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",
]
dev = [
    "psycopg2-binary>=2.9",
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
simplecode = "simplecode.cli:main"

[project.urls]
Homepage = "https://github.com/CraftsMan-Labs/SimpleCode"
Repository = "https://github.com/CraftsMan-Labs/SimpleCode"
"Bug Tracker" = "https://github.com/CraftsMan-Labs/SimpleCode/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/simplecode"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "live: tests that call real CLI runtimes (use -m live to run)",
]
