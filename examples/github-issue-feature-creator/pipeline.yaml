name: github-issue-feature-creator
description: Design a feature from a GitHub issue, wait for human approval, then implement, test, and review

# setup: setup.sh

agents:
  - id: planner
    prompts: prompts/planner/
    gate: human
    permissions: read-only
    timeout: 86400

  - id: implementer
    prompts: prompts/implementer/
    permissions: write
    timeout: 86400

  - id: tester
    prompts: prompts/tester/
    permissions: write
    timeout: 86400

  - id: reviewer
    prompts: prompts/reviewer/
    gate: human
    permissions: read-only
    timeout: 86400

  - id: executor
    prompts: prompts/executor/
    permissions: write
    timeout: 86400

  - id: tester
    prompts: prompts/tester/
    permissions: write
    timeout: 86400

  - id: cleanup
    prompts: prompts/cleanup/
    permissions: write
    timeout: 86400
