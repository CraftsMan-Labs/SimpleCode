name: ticket-delivery
description: Deliver one ticket through Explore → Build → Adversarial → QA

agents:
  - id: explorer
    prompts: prompts/explorer/
    permissions: read-only
    timeout: 86400

  - id: builder
    prompts: prompts/builder/
    permissions: write
    timeout: 86400

  - id: adversarial
    prompts: prompts/adversarial/
    permissions: read-only
    timeout: 86400

  - id: qa
    prompts: prompts/qa/
    gate: human
    permissions: read-only
    timeout: 86400
