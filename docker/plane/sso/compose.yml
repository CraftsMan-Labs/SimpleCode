# Optional SSO layer for Plane CE: LDAP -> Keycloak -> (Gitea-API shim) -> Plane.
# Layered on top of ../compose.yml; use:
#   make plane-sso-up
# or
#   docker compose -f docker/plane/compose.yml -f docker/plane/sso/compose.yml up -d
#
# Plane CE has no OIDC/SAML/LDAP. It does have a "Gitea" OAuth login with a configurable
# host, so the shim speaks Gitea's API on the front and Keycloak's OIDC on the back.
# Official Plane images are used as-is — never patched or rebuilt. Button label and
# logo are rewritten at sso-edge (PLANE_SSO_LOGIN_LABEL). See docs/plane.md.

services:
  # Plane's Caddy stays internal; this edge publishes LISTEN_HTTP_PORT and applies
  # branding rewrites. God-mode / API paths are proxied without substitution.
  proxy:
    ports: !reset []

  sso-edge:
    image: nginx:1.27-alpine
    environment:
      PLANE_SSO_LOGIN_LABEL: ${PLANE_SSO_LOGIN_LABEL:-SSO}
      # Only substitute the label; leave nginx $host / $uri etc. alone.
      NGINX_ENVSUBST_FILTER: PLANE_SSO_LOGIN_LABEL
    ports:
      - "${PLANE_HOST_BIND:-127.0.0.1}:${LISTEN_HTTP_PORT:-8180}:80"
    volumes:
      - ./sso/edge/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./sso/edge/proxy-upstream.conf:/etc/nginx/snippets/proxy-upstream.conf:ro
      - ./sso/edge/sso-logo.svg:/usr/share/nginx/branding/sso-logo.svg:ro
    depends_on:
      - proxy
      - sso-shim

  openldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?run make plane-sso-init}
      LDAP_TLS: "false"
    volumes:
      - ./sso/ldap/users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run make plane-sso-init}
      # One issuer URL is reachable from browsers (*.localhost -> loopback) and
      # containers (the simplecode-sso network alias below). Keep the internal
      # port equal to the published port so discovery never changes issuers.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://keycloak.localhost:8280}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8280"
      # Substituted into realm-plane.json on import.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?run make plane-sso-init}
      NINEROUTER_OIDC_CLIENT_SECRET: ${NINEROUTER_OIDC_CLIENT_SECRET:-}
      NINEROUTER_PUBLIC_URL: ${NINEROUTER_PUBLIC_URL:-http://localhost:20128}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?run make plane-sso-init}
      PLANE_WEB_URL: ${WEB_URL:-http://localhost:8180}
    ports:
      - "${PLANE_HOST_BIND:-127.0.0.1}:${KEYCLOAK_PORT:-8280}:8280"
    volumes:
      - ./sso/keycloak/realm-plane.json:/opt/keycloak/data/import/realm-plane.json:ro
      - keycloak_data:/opt/keycloak/data
    networks:
      default:
      simplecode-sso:
        aliases:
          - keycloak.localhost
    depends_on:
      - openldap

  sso-shim:
    image: python:3.12-alpine
    command: ["python", "-u", "/app/shim.py"]
    environment:
      PORT: ${SSO_SHIM_PORT:-8181}
      KC_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://keycloak.localhost:8280}
      KC_INTERNAL_URL: http://keycloak:8280
      KC_REALM: plane
    volumes:
      - ./sso/shim/shim.py:/app/shim.py:ro
    ports:
      - "${PLANE_HOST_BIND:-127.0.0.1}:${SSO_SHIM_PORT:-8181}:${SSO_SHIM_PORT:-8181}"
    networks:
      default:
        # Plane's api container reaches the shim at this name; the browser resolves
        # *.localhost to loopback, where the published port above answers.
        aliases:
          - sso.localhost
    depends_on:
      - keycloak

networks:
  # Created by docker/compose.yml (agent stack). `make stack-up` first if missing.
  simplecode-sso:
    name: simplecode-sso
    external: true

volumes:
  ldap_data:
  ldap_config:
  keycloak_data:
