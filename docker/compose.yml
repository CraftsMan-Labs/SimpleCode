# Shared agent stack: 9Router + Headroom + CocoIndex Code.
# One compose project for every repo on this machine — not per-project.
#
# Start (from this directory):
#   docker compose up -d
#
# Linux ownership for cocoindex bind mounts:
#   PUID=$(id -u) PGID=$(id -g) docker compose up -d
#
# Narrow cocoindex's visible tree (default is $HOME):
#   COCOINDEX_HOST_WORKSPACE=/Users/you/projects docker compose up -d
#
# Local embeddings (large image):
#   COCOINDEX_CODE_IMAGE=cocoindex/cocoindex-code:full docker compose up -d

name: simplecode-stack

services:
  headroom:
    image: ${HEADROOM_IMAGE:-ghcr.io/headroomlabs-ai/headroom:latest}
    container_name: simplecode-headroom
    restart: unless-stopped
    ports:
      - "${HEADROOM_HOST_BIND:-127.0.0.1}:${HEADROOM_PORT:-8787}:8787"
    environment:
      HEADROOM_HOST: "0.0.0.0"
      HEADROOM_PORT: "8787"
      HEADROOM_MODE: ${HEADROOM_MODE:-cache}
      HEADROOM_TELEMETRY: ${HEADROOM_TELEMETRY:-off}
    volumes:
      - headroom-data:/home/nonroot/.headroom
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - simplecode-stack

  9router:
    image: ${NINEROUTER_IMAGE:-decolua/9router:latest}
    container_name: simplecode-9router
    restart: unless-stopped
    depends_on:
      headroom:
        condition: service_healthy
    ports:
      - "${NINEROUTER_HOST_BIND:-127.0.0.1}:${NINEROUTER_PORT:-20128}:20128"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HEADROOM_URL: http://headroom:8787
    volumes:
      - ${NINEROUTER_DATA:-${HOME}/.9router}:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:20128/v1/models').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - simplecode-stack

  cocoindex-code:
    image: ${COCOINDEX_CODE_IMAGE:-cocoindex/cocoindex-code:latest}
    container_name: simplecode-cocoindex
    restart: unless-stopped
    volumes:
      - ${COCOINDEX_HOST_WORKSPACE:-${HOME}}:/workspace
      - cocoindex-data:/var/cocoindex
    environment:
      COCOINDEX_CODE_HOST_PATH_MAPPING: /workspace=${COCOINDEX_HOST_WORKSPACE:-${HOME}}
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    networks:
      - simplecode-stack

networks:
  simplecode-stack:
    name: simplecode-stack

volumes:
  headroom-data:
  cocoindex-data:
