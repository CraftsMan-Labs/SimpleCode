# Shared agent stack: 9Router + CocoIndex Code.
# One compose project for every repo on this machine — not per-project.
#
# Start (from this directory):
#   docker compose up -d
#
# Linux ownership for cocoindex bind mounts:
#   PUID=$(id -u) PGID=$(id -g) docker compose up -d
#
# Narrow cocoindex's visible tree (default is $HOME):
#   COCOINDEX_HOST_WORKSPACE=/Users/you/projects docker compose up -d
#
# Local embeddings (large image):
#   COCOINDEX_CODE_IMAGE=cocoindex/cocoindex-code:full docker compose up -d

name: simplecode-stack

services:
  9router:
    image: ${NINEROUTER_IMAGE:-decolua/9router:latest}
    container_name: simplecode-9router
    restart: unless-stopped
    ports:
      - "${NINEROUTER_HOST_BIND:-127.0.0.1}:${NINEROUTER_PORT:-20128}:20128"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Host→container published ports are not loopback inside the container,
      # so 9Router treats http://127.0.0.1:20128 as remote unless this is set.
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-123456}
    volumes:
      - ${NINEROUTER_DATA:-${HOME}/.9router}:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:20128/v1/models').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - simplecode-stack
      - simplecode-sso

  cocoindex-code:
    image: ${COCOINDEX_CODE_IMAGE:-cocoindex/cocoindex-code:latest}
    container_name: simplecode-cocoindex
    restart: unless-stopped
    volumes:
      - ${COCOINDEX_HOST_WORKSPACE:-${HOME}}:/workspace
      - cocoindex-data:/var/cocoindex
    environment:
      COCOINDEX_CODE_HOST_PATH_MAPPING: /workspace=${COCOINDEX_HOST_WORKSPACE:-${HOME}}
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    networks:
      - simplecode-stack

networks:
  simplecode-stack:
    name: simplecode-stack
  # Shared with Plane's Keycloak so 9Router can do OIDC token exchange.
  simplecode-sso:
    name: simplecode-sso

volumes:
  cocoindex-data:
